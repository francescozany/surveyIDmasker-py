[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surveyidmasker"
version = "0.3.0"
description = "Mask participant identifiers in survey exports (Python port of the surveyIDmasker R package)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Francesco Zanibellato", email = "fz150@georgetown.edu" }]
requires-python = ">=3.11"
keywords = ["survey", "Qualtrics", "Prolific", "MTurk", "anonymization", "de-identification", "SPSS"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = ["cryptography", "pandas", "pyreadstat", "openpyxl", "reverse_geocoder"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/francescozany/surveyIDmasker-py"
Issues = "https://github.com/francescozany/surveyIDmasker-py/issues"
"R version" = "https://github.com/francescozany/surveyIDmasker"

[project.scripts]
surveyidmasker = "surveyidmasker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
